{% extends "layout.html" %}

{% block content %}

{% load static %}

<div class="body">
    <div class="container">
        <div class="row">
            <h1>Medical Image Retrieval</h1>
        </div>
        <form method="POST" id="submitForm">
            {% csrf_token %}
            <div class="row">
                <div class="col">
                    <img src="{% static 'image/profile_placeholder.webp' %}" id="query-image" class="verify-image"
                        alt="Query Image">

                    <label for="input-query-image" class="label-image">Upload image</label>

                    <input type="file" accept="image/jpeg, image/png, image/jpg" id="input-query-image"
                        class="input-image" required>
                </div>
            </div>

            <div class="row">
                <p id="error-message" class="error-message">Error message</p>
            </div>
            <div class="row">
                <div class="col">
                    <label for="verify-button" class="label-verify">Query</label>

                    <input type="submit" id="verify-button" class="verify-button">
                </div>
            </div>
        </form>

        <section class="results-section">
            <h2>Results</h2>
            <div id="resultsContainer"></div>
        </section>
    </div>


    <aside id="sidebar" class="sidebar">
        <h2>Image Details</h2>
        <div id="imageDetails"></div>
    </aside>

</div>

<script>

    let queryImage = document.getElementById("query-image");
    let inputImage = document.getElementById("input-query-image");
    const resultsContainer = document.getElementById('resultsContainer');
    const sidebar = document.getElementById('sidebar');
    const imageDetails = document.getElementById('imageDetails');

    inputImage.onchange = () => {
        queryImage.src = URL.createObjectURL(inputImage.files[0]);
    }

    let submitForm = document.getElementById("submitForm");
    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
    let errorMessage = document.getElementById("error-message");

    errorMessage.style.opacity = 0;

    submitForm.addEventListener("submit", e => {
        e.preventDefault();

        const formData = new FormData();
        formData.append('query_image', inputImage.files[0]);

        fetch("/api/query", {
            method: "POST",
            headers: {
                'X-CSRFToken': csrfToken,
            },
            body: formData,
        })
            .then(response => response.json())
            .then(data => {
                // console.log("Client: " + data)
                displayResults(data["results"]);
            })
            .catch(error => {
                console.error(error);
            });
    })

    function displayResults(results) {
        resultsContainer.innerHTML = '';
        results.forEach(result => {
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            // resultItem.innerHTML = `
            //     <img src="https://via.placeholder.com/300x300.png?text=${result.image_filename}" alt="${result.image_filename}">
            // `;
            resultItem.innerHTML = `
                <img src="/static/image/${result.image_filename}" alt="${result.image_filename}" class="verify-image">
            `;
            resultItem.addEventListener('click', () => showDetails(result));
            resultsContainer.appendChild(resultItem);
        });
    }

    function showDetails(result) {
        imageDetails.innerHTML = `
            <h3>${result.image_filename}</h3>
            <p>Labels: ${result.labels}</p>
            <p>Patient ID: ${result.patient_id}</p>
            <p>Age: ${result.patient_age}</p>
            <p>Gender: ${result.patient_gender}</p>
            <p>View Position: ${result.view_position}</p>
        `;
        sidebar.classList.add('active');
    }

</script>

{% endblock content %}
